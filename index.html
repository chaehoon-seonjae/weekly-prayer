<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>우리 순 기도제목</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@font-face {
  font-family: 'Pretendard';
  src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
  font-weight: 45 920;
}
:root{
  --sky:#7FB2E5;
  --sky-deep:#5B93CC;
  --sky-tint:#EEF5FC;
  --sun:#F4B740;
  --sun-soft:#FCEACB;
  --navy:#223047;
  --slate:#5C6B7A;
  --white:#FFFFFF;
  --shadow: 0 8px 24px -12px rgba(95,140,190,0.35);
  --radius-card:20px;
  --radius-btn:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:'Pretendard', sans-serif;
  background:
    radial-gradient(1200px 400px at 50% -10%, #fff8e8 0%, transparent 60%),
    linear-gradient(180deg, var(--sky-tint) 0%, #FBFDFF 320px, #FBFDFF 100%);
  color:var(--navy);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.mono{ font-family:'Pretendard', sans-serif; }
#app{ max-width:480px; margin:0 auto; padding:0 20px 120px; position:relative; }

/* ---------- Header ---------- */
.week-header{
  margin-top:22px;
  padding:24px 22px;
  border-radius:24px;
  color:#fff;
  background:linear-gradient(135deg, var(--sky) 0%, var(--sky-deep) 55%, #4E7DB5 100%);
  box-shadow: var(--shadow);
  position:relative;
  overflow:hidden;
}
.week-header::after{
  content:"";
  position:absolute; right:-40px; top:-40px;
  width:160px; height:160px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.35), transparent 70%);
}
.week-header .eyebrow{ font-size:13px; opacity:.85; letter-spacing:.02em; }
.week-header h1{ font-size:22px; margin:6px 0 2px; font-weight:700; }
.week-header .date{ font-size:13px; opacity:.9; }
.progress-row{
  display:flex; align-items:center; gap:10px; margin-top:16px;
}
.dots{ display:flex; gap:5px; }
.dot{ width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.35); }
.dot.filled{ background:var(--sun); box-shadow:0 0 0 3px rgba(244,183,64,0.25); }
.progress-text{ font-size:13px; font-weight:600; }
.complete-banner{
  margin-top:14px; padding:10px 14px; border-radius:14px;
  background:rgba(255,255,255,0.18); font-size:13px; font-weight:600;
  display:flex; align-items:center; gap:6px;
}

/* meeting navigation */
.meeting-nav{
  display:grid; grid-template-columns:auto 1fr auto; align-items:center;
  gap:12px; margin:16px 0 20px; padding:4px 2px;
}
.nav-side{ display:flex; align-items:center; gap:8px; color:var(--slate); font-size:13px; cursor:pointer; min-width:80px; min-height:44px; padding:0 8px; transition:color .2s ease; }
.nav-side:hover{ color:var(--sky-deep); }
.nav-side.next{ justify-content:flex-end; text-align:right; }
.nav-side.disabled{ opacity:.35; pointer-events:none; cursor:default; }
.nav-arrow{ width:36px; height:36px; min-width:36px; border-radius:50%; border:1px solid rgba(90,125,204,0.5); background:#fff; color:var(--sky-deep); display:flex; align-items:center; justify-content:center; font-size:22px; line-height:1; box-shadow:0 4px 10px rgba(91,147,204,0.16); }
.nav-side:not(.disabled):hover .nav-arrow{ box-shadow:0 6px 14px rgba(91,147,204,0.24); }
.nav-date{ white-space:nowrap; font-family:'Pretendard', sans-serif; font-weight:700; }
.nav-center{ text-align:center; min-width:104px; }
.nav-center .label{ font-size:11px; font-weight:700; color:var(--sun); margin-bottom:3px; }
.nav-center .date{ font-family:'Pretendard', sans-serif; font-size:17px; font-weight:800; color:var(--navy); }
.nav-center .line{ width:34px; height:3px; border-radius:99px; background:var(--sun); margin:7px auto 0; }
/* CTA */
.cta-btn{
  width:100%; margin-top:2px; padding:16px; border:none; border-radius:var(--radius-btn);
  background:var(--sun); color:#3A2A05; font-size:16px; font-weight:700;
  box-shadow:0 10px 20px -10px rgba(244,183,64,0.6);
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
}
.cta-btn:active{ transform:scale(0.98); }
.cta-btn[disabled]{ opacity:.45; box-shadow:none; }

/* nudge */
.nudge{
  margin-top:14px; padding:12px 14px; border-radius:14px; background:var(--sky-tint);
  font-size:13px; color:var(--slate); line-height:1.6;
}
.nudge b{ color:var(--navy); }

/* cards */
.cards{ margin-top:20px; display:flex; flex-direction:column; gap:14px; }
.card{
  background:#fff; border-radius:var(--radius-card); padding:20px;
  box-shadow:var(--shadow); border:1px solid #F0F5FA;
  transition:box-shadow .2s;
}
.card.highlight{ box-shadow:0 0 0 2px var(--sun), var(--shadow); }
.card-top{ display:flex; align-items:center; justify-content:space-between; }
.card-name{ font-size:16px; font-weight:700; }
.kebab{
  border:none; background:transparent; color:var(--slate); font-size:18px; cursor:pointer;
  padding:4px 8px; border-radius:8px;
}
.kebab:active{ background:var(--sky-tint); }
.item-list{ margin-top:10px; }
.item{ margin-bottom:10px; }
.item:last-child{ margin-bottom:0; }
.item-title{ font-size:14.5px; line-height:1.7; white-space:pre-wrap; }
.item-title::before{ content: attr(data-idx) ". "; color:var(--sky-deep); font-weight:700; font-family:'Pretendard', sans-serif; }
.item-detail{ font-size:13px; color:var(--slate); line-height:1.7; margin:4px 0 0 18px; white-space:pre-wrap; }
.item-detail::before{ content:"· "; }

.more-toggle{
  margin-top:8px; font-size:12.5px; color:var(--sky-deep); font-weight:600; cursor:pointer; display:inline-block;
}
.card.collapsed .item-list{
  max-height:96px; overflow:hidden; position:relative;
  mask-image:linear-gradient(180deg, #000 60%, transparent 100%);
}

.card-bottom{
  margin-top:14px; padding-top:14px; border-top:1px solid #F1F5F9;
  display:flex; align-items:center; justify-content:space-between;
}
.pray-btn{
  border:none; background:var(--sun-soft); color:#8A5A00; font-weight:700; font-size:13.5px;
  padding:9px 14px; border-radius:999px; cursor:pointer; position:relative; overflow:visible;
}
.pray-btn.done{ background:var(--sky-tint); color:var(--sky-deep); }
.pray-btn .count{ font-family:'Pretendard', sans-serif; margin-left:2px; }
.glow{
  position:absolute; inset:-14px; border-radius:999px;
  background:radial-gradient(circle, rgba(244,183,64,0.55), transparent 70%);
  opacity:0; pointer-events:none;
}
@keyframes glowPulse{ 0%{opacity:.9; transform:scale(0.6);} 100%{opacity:0; transform:scale(1.6);} }
.glow.play{ animation:glowPulse .6s ease-out; }
@media (prefers-reduced-motion: reduce){ .glow.play{ animation:none; } }

.empty-card{
  background:#fff; border-radius:var(--radius-card); padding:36px 20px; text-align:center;
  color:var(--slate); border:1px dashed #D9E7F5; margin-top:20px;
}
.empty-card .sun-icon{ font-size:26px; margin-bottom:8px; }

/* copy bar */
.copy-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; justify-content:center; padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, transparent, #FBFDFF 30%);
}
.copy-bar-inner{ width:100%; max-width:440px; }
.copy-btn{
  width:100%; padding:15px; border:none; border-radius:var(--radius-btn);
  background:var(--navy); color:#fff; font-size:15px; font-weight:700; cursor:pointer;
  box-shadow:0 10px 24px -10px rgba(34,48,71,0.5);
}
.copy-btn.ready{ background:linear-gradient(135deg, var(--sky-deep), var(--navy)); }

/* toast */
.toast{
  position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-140%);
  background:var(--navy); color:#fff; padding:10px 18px; border-radius:999px; font-size:13.5px;
  z-index:100; transition:transform .3s ease; box-shadow:0 10px 24px -8px rgba(0,0,0,0.3);
}
.toast.show{ transform:translateX(-50%) translateY(0); }

/* sheet / modal */
.overlay{
  position:fixed; inset:0; background:rgba(34,48,71,0.45); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.overlay.show{ opacity:1; pointer-events:auto; }
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:41;
  background:#fff; border-radius:24px 24px 0 0; max-width:480px; margin:0 auto;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%); transition:transform .28s cubic-bezier(.22,.9,.35,1);
  max-height:88vh; overflow-y:auto;
}
.sheet.show{ transform:translateY(0); }
.sheet-handle{ width:36px; height:4px; background:#E3E9EF; border-radius:99px; margin:0 auto 14px; }
.sheet-title{ font-size:17px; font-weight:700; margin-bottom:4px; }
.sheet-sub{ font-size:13px; color:var(--slate); margin-bottom:16px; }

.member-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px; }
.member-chip{
  padding:14px 8px; border-radius:16px; text-align:center; background:var(--sky-tint);
  border:1px solid transparent; font-weight:700; font-size:14.5px; cursor:pointer; color:var(--navy);
}
.member-chip.done{ background:#F5F7F9; color:#AAB4BE; cursor:default; }
.member-chip.done .check{ display:block; font-size:11px; font-weight:600; margin-top:2px; color:#9AA6B1; }

.field{ margin-top:14px; }
.field-label{ font-size:12.5px; color:var(--slate); font-weight:600; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
textarea{
  width:100%; border:1px solid #E3EEF8; border-radius:14px; padding:12px 14px;
  font-family:inherit; font-size:14.5px; line-height:1.6; resize:none; background:var(--sky-tint);
  color:var(--navy);
}
textarea:focus{ outline:2px solid var(--sky); background:#fff; }
.prayer-item-block{ border:1px solid #EDF3F9; border-radius:16px; padding:14px; margin-top:12px; position:relative; }
.prayer-item-block .idx{ font-family:'Pretendard', sans-serif; font-weight:700; color:var(--sky-deep); font-size:13px; margin-bottom:6px; }
.detail-toggle{ font-size:12.5px; color:var(--sky-deep); font-weight:600; cursor:pointer; margin-top:8px; display:inline-block; }
.remove-item{ position:absolute; top:10px; right:12px; background:none; border:none; color:#C7D2DC; font-size:15px; cursor:pointer; }
.detail-row{ display:flex; gap:8px; align-items:flex-start; margin-top:8px; }
.detail-row textarea{ flex:1; min-height:72px; }
.detail-remove{ border:none; background:#F4F7FB; color:#8A97A4; border-radius:10px; padding:8px 10px; font-size:13px; cursor:pointer; }
.add-detail-btn{ margin-top:8px; border:none; background:transparent; color:var(--sky-deep); font-weight:700; font-size:12.5px; cursor:pointer; padding:0; }
.add-item-btn{
  width:100%; margin-top:12px; padding:12px; border-radius:14px; border:1.5px dashed #C9DEF2;
  background:transparent; color:var(--sky-deep); font-weight:700; font-size:13.5px; cursor:pointer;
}
.save-btn{
  width:100%; margin-top:18px; padding:15px; border:none; border-radius:14px;
  background:var(--sun); color:#3A2A05; font-weight:700; font-size:15px; cursor:pointer;
}
.save-row{ display:flex; gap:8px; margin-top:18px; }
.save-row .save-btn{ margin-top:0; flex:2; }
.danger-btn{
  flex:1; border:1px solid #F3D9D9; background:#FFF6F6; color:#C1554B; border-radius:14px;
  font-weight:700; font-size:14px; cursor:pointer;
}

.confirm-box{ text-align:center; padding:6px 4px 0; }
.confirm-box p{ font-size:14.5px; line-height:1.6; margin:0 0 18px; }
.confirm-actions{ display:flex; gap:10px; }
.confirm-actions button{ flex:1; padding:13px; border-radius:12px; font-weight:700; font-size:14px; border:none; cursor:pointer; }
.confirm-cancel{ background:#F2F5F8; color:var(--slate); }
.confirm-delete{ background:#E2554B; color:#fff; }

.preview-box{
  background:var(--sky-tint); border-radius:16px; padding:16px; font-size:13px; line-height:1.8;
  white-space:pre-wrap; font-family:'Pretendard', sans-serif; color:var(--navy); max-height:50vh; overflow-y:auto;
}

.skeleton{ background:#fff; border-radius:var(--radius-card); padding:20px; box-shadow:var(--shadow); }
.sk-line{ height:12px; border-radius:6px; background:linear-gradient(90deg,#EEF3F8 25%,#F7FAFD 37%,#EEF3F8 63%); background-size:400% 100%; animation:shimmer 1.3s infinite; margin-bottom:10px; }
@keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ 데이터 연결 설정 ============ */
const SUPABASE_URL = "https://jjubqeqqtvjvxlbnnuyt.supabase.co"; // 여기에 Project URL
const SUPABASE_KEY = "sb_publishable_vKXSP4T6JYQrZmSpdbf-zg_6msfRmgJ"; // 여기에 Publishable key
const USE_SUPABASE = Boolean(SUPABASE_URL && SUPABASE_KEY);

/* ============ 로컬 미연결 상태용 기본 구조 (기도제목 데모 데이터 없음) ============ */
const MEMBERS = ["지영","선재","세희","평화","종호","도희","예송","수람","유찬"];
const STORAGE_KEY = "prayer_app_state_v5";

function seedData(){
  const weeks = [
    { id:"w40", week_number:40, week_date:"2026-08-23" },
    { id:"w39", week_number:39, week_date:"2026-08-16" },
    { id:"w38", week_number:38, week_date:"2026-08-09" },
    { id:"w37", week_number:37, week_date:"2026-08-02" },
    { id:"w36", week_number:36, week_date:"2026-07-26" },
  ];
  const entries = {
    w40: {},
    w39: {},
    w38: {},
    w37: {},
    w36: {},
  };
  return { weeks, entries, currentWeek:"w38" };
}

function loadState(){
  // Prayer data must come from Supabase only. Do not restore demo prayer entries from LocalStorage.
  return seedData();
}
function saveState(){
  // UI state is intentionally not persisted as prayer data. Supabase is the source of truth.
}
function prayedKey(weekId, name){ return `prayed:${weekId}:${name}`; }

let state = loadState();
state.currentWeek = defaultMeetingId?.() || state.currentWeek;
let collapsedCards = {}; // name -> bool
let editingMember = null; // 작성/수정 대상

/* ============ 렌더링 ============ */
const app = document.getElementById("app");

function currentWeekMeta(){ return state.weeks.find(w=>w.id===state.currentWeek); }
function currentEntries(){ return state.entries[state.currentWeek] || {}; }
function writtenCount(){ return Object.keys(currentEntries()).length; }
function isPastWeek(){
  const meta = currentWeekMeta();
  if(!meta) return false;
  return meta.week_date < mostRecentSundayISO();
}
function isFutureWeek(){
  const meta = currentWeekMeta();
  if(!meta) return false;
  return meta.week_date > mostRecentSundayISO();
}
function isLatestMeeting(){
  const meta = currentWeekMeta();
  if(!meta) return false;
  const sorted = sortedWeeksAsc();
  return meta.id === sorted[sorted.length - 1]?.id;
}
function fmtDate(d){
  const [y,m,day] = d.split("-");
  return `${y}.${m}.${day}`;
}

function shortDate(d){
  const [,m,day] = d.split("-");
  return `${m}/${day}`;
}
function mostRecentSundayISO(base=new Date()){
  const d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  d.setDate(d.getDate() - d.getDay());
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function defaultMeetingId(){
  const sunday = mostRecentSundayISO();
  const candidates = [...state.weeks].filter(w=>w.week_date<=sunday).sort((a,b)=>b.week_date.localeCompare(a.week_date));
  return (candidates[0] || [...state.weeks].sort((a,b)=>b.week_date.localeCompare(a.week_date))[0])?.id;
}
function isCurrentMeeting(){ return state.currentWeek === defaultMeetingId(); }
function sortedWeeksAsc(){ return [...state.weeks].sort((a,b)=>a.week_date.localeCompare(b.week_date)); }
function adjacentMeeting(direction){
  const arr=sortedWeeksAsc(); const idx=arr.findIndex(w=>w.id===state.currentWeek);
  return arr[idx+direction] || null;
}

function render(){
  const meta = currentWeekMeta();
  const entries = currentEntries();
  const names = Object.keys(entries);
  const total = MEMBERS.length;
  const done = names.length;
  const allDone = done === total;
  const unwritten = MEMBERS.filter(m=>!entries[m]);

  let dotsHtml = "";
  for(let i=0;i<total;i++){ dotsHtml += `<span class="dot ${i<done?'filled':''}"></span>`; }

  const headerHtml = `
    <div class="week-header">
      <div class="eyebrow">${isLatestMeeting() ? "마지막 순모임" : isFutureWeek() ? "다음 순모임" : isPastWeek() ? "지난 순모임" : "이번 주 순모임"}</div>
      <h1 class="mono">${meta.week_number}번째 순모임</h1>
      <div class="date mono">${fmtDate(meta.week_date)}</div>
      <div class="progress-row">
        <div class="dots">${dotsHtml}</div>
        <div class="progress-text mono">${done} / ${total} 작성 완료</div>
      </div>
      ${allDone ? `<div class="complete-banner">☀️ 이번 주 기도제목이 모두 모였어요</div>` : ``}
    </div>
  `;

  const prev = adjacentMeeting(-1);
  const next = adjacentMeeting(1);
  const stripHtml = `
    <div class="meeting-nav">
      <div class="nav-side ${prev?'':'disabled'}" id="prevMeeting" data-direction="-1">
        <span class="nav-arrow">‹</span>
        <span class="nav-date">${prev ? shortDate(prev.week_date) : ''}</span>
      </div>
      <div class="nav-center">
        <div class="label">${isCurrentMeeting() ? '이번 순모임' : isLatestMeeting() ? '마지막 순모임' : isFutureWeek() ? '다음 순모임' : '지난 순모임'}</div>
        <div class="date">${shortDate(meta.week_date)}</div>
        <div class="line"></div>
      </div>
      <div class="nav-side next ${next?'':'disabled'}" id="nextMeeting" data-direction="1">
        <span class="nav-date">${next ? shortDate(next.week_date) : ''}</span>
        <span class="nav-arrow">›</span>
      </div>
    </div>
  `;

  let ctaHtml = "";
  if(!isPastWeek()){
    ctaHtml = allDone
      ? `<button class="cta-btn" disabled>✓ 이번 주 기도제목 작성 완료</button>`
      : `<button class="cta-btn" id="btnWrite">＋ 이번 주 기도제목 나누기</button>`;
    if(!allDone && unwritten.length>0){
      ctaHtml += `<div class="nudge">아직 <b>${unwritten.length}명</b>이 기도제목을 준비 중이에요. 천천히 나눠주셔도 괜찮아요 🌤️</div>`;
    }
  }

  let cardsHtml = "";
  if(done===0){
    cardsHtml = `
      <div class="empty-card">
        <div class="sun-icon">🌤️</div>
        <div>아직 아무도 기도제목을 나누지 않았어요.<br/>가장 먼저 나눠보는 건 어떨까요?</div>
      </div>`;
  } else {
    cardsHtml = `<div class="cards">` + names.map(name=>{
      const e = entries[name];
      const alreadyPrayed = !!localStorage.getItem(prayedKey(state.currentWeek, name));
      const collapsed = collapsedCards[name] !== false && e.items.length > 3;
      return `
        <div class="card ${collapsed?'collapsed':''}" data-name="${name}">
          <div class="card-top">
            <div class="card-name">${name}</div>
            ${!isPastWeek() ? `<button class="kebab" data-edit="${name}">⋯</button>` : ``}
          </div>
          <div class="item-list">
            ${e.items.map((it,i)=>`
              <div class="item">
                <div class="item-title" data-idx="${i+1}">${escapeHtml(it.title)}</div>
                ${getDetailLines(it).map(detail=>`<div class="item-detail">${escapeHtml(detail)}</div>`).join("")}
              </div>
            `).join("")}
          </div>
          ${e.items.length>3 ? `<span class="more-toggle" data-toggle="${name}">${collapsed?'더보기':'접기'}</span>` : ``}
          <div class="card-bottom">
            <button class="pray-btn ${alreadyPrayed?'done':''}" data-pray="${name}" ${alreadyPrayed?'disabled':''}>
              <span class="glow"></span>
              🙏 ${alreadyPrayed ? '함께 기도했어요' : '기도했어요'} <span class="count mono">· ${e.prayed}</span>
            </button>
          </div>
        </div>
      `;
    }).join("") + `</div>`;
  }

  const copyBarHtml = !isPastWeek() ? `
    <div class="copy-bar">
      <div class="copy-bar-inner">
        <button class="copy-btn ${allDone?'ready':''}" id="btnCopyAll">
          ${allDone ? "전체 기도제목 복사" : `지금까지 작성된 ${done}명 기도제목 복사`}
        </button>
      </div>
    </div>
  ` : "";

  app.innerHTML = headerHtml + stripHtml + (USE_SUPABASE ? `` : `<div class="nudge"><b>데모 모드</b> · Supabase URL과 Publishable key를 넣으면 공용 DB 모드로 전환됩니다.</div>`) + ctaHtml + cardsHtml + copyBarHtml;
  bindHomeEvents();
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function getDetailLines(item){
  if(Array.isArray(item?.details)){
    return item.details.map(v=>String(v||"").trim()).filter(Boolean);
  }
  if(typeof item?.detail === "string"){
    return item.detail.split(/\n+/).map(v=>v.trim()).filter(Boolean);
  }
  return [];
}

function bindHomeEvents(){
  const prevBtn = document.getElementById("prevMeeting");
  const nextBtn = document.getElementById("nextMeeting");
  document.querySelectorAll(".nav-side[data-direction]").forEach(el=>{
    if(el.classList.contains('disabled')) return;
    const direction = Number(el.dataset.direction);
    el.onclick = ()=>{
      const nextWeek = adjacentMeeting(direction);
      if(nextWeek){ state.currentWeek = nextWeek.id; render(); }
    };
  });
  const btnWrite = document.getElementById("btnWrite");
  if(btnWrite) btnWrite.onclick = ()=> openMemberSheet();

  document.querySelectorAll("[data-toggle]").forEach(el=>{
    el.onclick = ()=>{
      const name = el.dataset.toggle;
      collapsedCards[name] = !collapsedCards[name];
      render();
    };
  });

  document.querySelectorAll("[data-pray]").forEach(el=>{
    el.onclick = async ()=>{
      const name = el.dataset.pray;
      const key = prayedKey(state.currentWeek, name);
      if(localStorage.getItem(key)) return;
      const entry = state.entries[state.currentWeek][name];
      const nextCount = (entry.prayed || 0) + 1;
      if(USE_SUPABASE && window.__db && entry.id){
        const {error} = await window.__db.from("prayers").update({prayed_count:nextCount}).eq("id", entry.id);
        if(error){ console.error(error); showToast("저장 중 오류가 발생했어요"); return; }
      }
      localStorage.setItem(key, "1");
      entry.prayed = nextCount;
      if(!USE_SUPABASE) saveState();
      const glow = el.querySelector(".glow");
      glow.classList.add("play");
      el.classList.add("done");
      el.disabled = true;
      setTimeout(()=>render(), 550);
    };
  });

  document.querySelectorAll("[data-edit]").forEach(el=>{
    el.onclick = ()=> openWriteSheet(el.dataset.edit, true);
  });

  const btnCopy = document.getElementById("btnCopyAll");
  if(btnCopy) btnCopy.onclick = ()=> openPreviewSheet();
}

/* ============ 시트(모달) 공통 ============ */
const overlay = document.getElementById("overlay");
function openSheet(html){
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.id = "activeSheet";
  sheet.innerHTML = `<div class="sheet-handle"></div>` + html;
  document.body.appendChild(sheet);
  overlay.classList.add("show");
  requestAnimationFrame(()=> sheet.classList.add("show"));
  overlay.onclick = closeSheet;
  return sheet;
}
function closeSheet(){
  const sheet = document.getElementById("activeSheet");
  overlay.classList.remove("show");
  if(sheet){ sheet.classList.remove("show"); setTimeout(()=>sheet.remove(), 250); }
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 1800);
}

/* ---- 작성자 선택 ---- */
function openMemberSheet(){
  const entries = currentEntries();
  const html = `
    <div class="sheet-title">누구의 기도제목을 나눌까요?</div>
    <div class="sheet-sub">이름을 선택해주세요</div>
    <div class="member-grid">
      ${MEMBERS.map(m=>{
        const done = !!entries[m];
        return `<div class="member-chip ${done?'done':''}" data-member="${m}">
          ${m}${done?'<span class="check">✓ 작성 완료</span>':''}
        </div>`;
      }).join("")}
    </div>
  `;
  const sheet = openSheet(html);
  sheet.querySelectorAll(".member-chip:not(.done)").forEach(el=>{
    el.onclick = ()=>{ closeSheet(); setTimeout(()=> openWriteSheet(el.dataset.member,false), 260); };
  });
}

/* ---- 작성/수정 폼 ---- */
let draftItems = [];
function openWriteSheet(name, isEdit){
  editingMember = name;
  const entries = currentEntries();
  const existing = entries[name];
  draftItems = existing ? JSON.parse(JSON.stringify(existing.items)).map(it=>({
    title: it.title || "",
    detail: it.detail || "",
    details: getDetailLines(it),
    showDetail: getDetailLines(it).length > 0
  })) : [{title:"",detail:"",details:[],showDetail:false}];
  renderWriteSheet(name, isEdit);
}
function renderWriteSheet(name, isEdit){
  const html = `
    <div class="sheet-title">${name}님의 기도제목</div>
    <div class="sheet-sub">${isEdit? "내용을 수정해주세요" : "한 주간 나누고 싶은 기도제목을 적어주세요"}</div>
    <div id="itemsWrap"></div>
    <button class="add-item-btn" id="btnAddItem">＋ 기도제목 추가</button>
    <div class="save-row">
      ${isEdit ? `<button class="danger-btn" id="btnDelete">삭제</button>` : ``}
      <button class="save-btn" id="btnSave">저장하기</button>
    </div>
  `;
  const sheet = openSheet(html);
  const wrap = sheet.querySelector("#itemsWrap");

  function paintItems(){
    wrap.innerHTML = draftItems.map((it,i)=>`
      <div class="prayer-item-block" data-i="${i}">
        ${draftItems.length>1 ? `<button class="remove-item" data-remove="${i}">✕</button>` : ``}
        <div class="idx">${i+1}</div>
        <textarea rows="2" placeholder="기도제목을 적어주세요" data-title="${i}">${it.title}</textarea>
        <div class="detail-list" data-detail-list="${i}">
          ${(it.details && it.details.length ? it.details : (it.detail ? [it.detail] : [""])).map((detail, di)=>`
            <div class="detail-row" data-detail-row="${di}">
              <textarea rows="2" placeholder="상세 내용" data-detail="${i}" data-detail-index="${di}">${detail}</textarea>
              <button class="detail-remove" data-remove-detail="${i}" data-detail-index="${di}">✕</button>
            </div>
          `).join("")}
        </div>
        <button class="add-detail-btn" data-add-detail="${i}">＋ 상세 내용 추가</button>
      </div>
    `).join("");

    wrap.querySelectorAll("[data-title]").forEach(t=>{
      t.oninput = ()=> draftItems[t.dataset.title].title = t.value;
    });
    wrap.querySelectorAll("[data-detail]").forEach(t=>{
      t.oninput = ()=> {
        const item = draftItems[t.dataset.detail];
        const idx = Number(t.dataset.detailIndex || 0);
        const value = t.value;
        item.details = (item.details || []);
        item.details[idx] = value;
        item.details = item.details.filter((v, i)=> i < item.details.length && (v || i === idx));
        item.detail = item.details.join("\n");
      };
    });
    wrap.querySelectorAll("[data-add-detail]").forEach(b=>{
      b.onclick = ()=>{
        const item = draftItems[b.dataset.addDetail];
        item.details = item.details || [];
        item.details.push("");
        item.showDetail = true;
        paintItems();
      };
    });
    wrap.querySelectorAll("[data-remove-detail]").forEach(b=>{
      b.onclick = ()=>{
        const item = draftItems[b.dataset.removeDetail];
        const idx = Number(b.dataset.detailIndex || 0);
        item.details = (item.details || []).filter((_, i)=> i !== idx);
        if(item.details.length === 0) item.details = [];
        item.detail = item.details.join("\n");
        paintItems();
      };
    });
    wrap.querySelectorAll("[data-remove]").forEach(b=>{
      b.onclick = ()=>{ draftItems.splice(b.dataset.remove,1); paintItems(); };
    });
  }
  paintItems();

  sheet.querySelector("#btnAddItem").onclick = ()=>{
    draftItems.push({title:"",detail:"",showDetail:false});
    paintItems();
  };

  sheet.querySelector("#btnSave").onclick = async ()=>{
    const cleaned = draftItems
      .map(it=>{
        const details = (it.details || []).map(v=>String(v||"").trim()).filter(Boolean);
        return {title:(it.title||"").trim(), detail:details.join("\n")};
      })
      .filter(it=>it.title.length>0);
    if(cleaned.length===0){ showToast("기도제목을 한 가지 이상 입력해주세요"); return; }
    const prev = currentEntries()[name];
    const prevPrayed = (prev && prev.prayed) || 0;
    let savedEntry = { items:cleaned, prayed:prevPrayed };
    if(USE_SUPABASE && window.__db){
      const member = (window.__members || []).find(m=>m.name===name);
      if(!member){ showToast("순원 정보를 찾을 수 없어요"); return; }
      const payload = { meeting_id:Number(state.currentWeek), member_id:member.id, items:cleaned, prayed_count:prevPrayed, updated_at:new Date().toISOString() };
      const {data,error} = await window.__db.from("prayers").upsert(payload,{onConflict:"meeting_id,member_id"}).select().single();
      if(error){ console.error(error); showToast("저장 중 오류가 발생했어요"); return; }
      savedEntry = {id:data.id, items:data.items||cleaned, prayed:data.prayed_count||0, member_id:data.member_id};
    }
    if(!state.entries[state.currentWeek]) state.entries[state.currentWeek] = {};
    state.entries[state.currentWeek][name] = savedEntry;
    if(!USE_SUPABASE) saveState();
    closeSheet();
    collapsedCards[name] = true;
    render();
    showToast(isEdit ? "✓ 기도제목을 수정했어요" : "✓ 기도제목을 나눴어요");
    setTimeout(()=>{
      const card = document.querySelector(`.card[data-name="${name}"]`);
      if(card){ card.classList.add("highlight"); card.scrollIntoView({behavior:"smooth", block:"center"}); setTimeout(()=>card.classList.remove("highlight"), 1600); }
    }, 100);
  };

  const delBtn = sheet.querySelector("#btnDelete");
  if(delBtn){
    delBtn.onclick = ()=>{
      closeSheet();
      setTimeout(()=> openDeleteConfirm(name), 260);
    };
  }
}

function openDeleteConfirm(name){
  const html = `
    <div class="confirm-box">
      <p><b>${name}</b>님의 이번 주 기도제목을<br/>삭제할까요?</p>
      <div class="confirm-actions">
        <button class="confirm-cancel" id="btnCancel">취소</button>
        <button class="confirm-delete" id="btnConfirmDelete">삭제하기</button>
      </div>
    </div>
  `;
  const sheet = openSheet(html);
  sheet.querySelector("#btnCancel").onclick = closeSheet;
  sheet.querySelector("#btnConfirmDelete").onclick = async ()=>{
    const entry = state.entries[state.currentWeek][name];
    if(USE_SUPABASE && window.__db && entry?.id){
      const {error} = await window.__db.from("prayers").delete().eq("id", entry.id);
      if(error){ console.error(error); showToast("삭제 중 오류가 발생했어요"); return; }
    }
    delete state.entries[state.currentWeek][name];
    if(!USE_SUPABASE) saveState();
    closeSheet();
    render();
    showToast("삭제되었어요");
  };
}

/* ---- 전체 취합 미리보기 ---- */
function buildCompiledText(){
  const meta = currentWeekMeta();
  const entries = currentEntries();
  let out = `♥ 우리 순 기도제목 ♥\n${fmtDate(meta.week_date)} ${meta.week_number}번째 순모임\n`;
  MEMBERS.forEach(name=>{
    if(!entries[name]) return;
    out += `\n♥${name}\n`;
    entries[name].items.forEach((it,i)=>{
      out += `${i+1}. ${it.title}\n`;
      getDetailLines(it).forEach(detail=>{ out += `- ${detail}\n`; });
    });
  });
  return out;
}
function openPreviewSheet(){
  const text = buildCompiledText();
  const html = `
    <div class="sheet-title">전체 기도제목 미리보기</div>
    <div class="sheet-sub">카카오톡에 그대로 붙여넣을 수 있어요</div>
    <div class="preview-box">${escapeHtml(text)}</div>
    <button class="save-btn" id="btnDoCopy" style="margin-top:16px;">전체 기도제목 복사</button>
  `;
  const sheet = openSheet(html);
  sheet.querySelector("#btnDoCopy").onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(text);
    }catch(e){
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    closeSheet();
    showToast("✓ 기도제목을 복사했어요");
  };
}

/* ============ Supabase 연결 (값 입력 시 자동 사용) ============ */
async function loadFromSupabase(){
  if(!USE_SUPABASE) return false;
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const [{data:members,error:me},{data:meetings,error:mt},{data:prayers,error:pr}] = await Promise.all([
    client.from("members").select("id,name,display_order").order("display_order"),
    client.from("meetings").select("id,meeting_date,meeting_number").order("meeting_date",{ascending:false}),
    client.from("prayers").select("id,meeting_id,member_id,items,prayed_count")
  ]);
  if(me||mt||pr){
    const err = me || mt || pr;
    console.error(err);
    throw new Error(err?.message || "Supabase 조회 중 오류가 발생했습니다.");
  }
  window.__db = client; window.__members = members;
  const memberById = Object.fromEntries(members.map(m=>[m.id,m.name]));
  state.weeks = meetings.map(m=>({id:String(m.id),week_number:m.meeting_number,week_date:m.meeting_date}));
  state.entries = {};
  state.weeks.forEach(w=>state.entries[w.id]={});
  prayers.forEach(p=>{ const name=memberById[p.member_id]; if(name && state.entries[String(p.meeting_id)]) state.entries[String(p.meeting_id)][name]={id:p.id,items:p.items||[],prayed:p.prayed_count||0,member_id:p.member_id}; });
  state.currentWeek = defaultMeetingId();
  return true;
}

function renderConnectionError(message){
  app.innerHTML = `
    <div class="week-header">
      <div class="eyebrow">연결 상태</div>
      <h1>기도제목을 불러오지 못했어요</h1>
      <div class="date" style="margin-top:8px; line-height:1.6;">${escapeHtml(message)}</div>
    </div>
    <div class="empty-card">
      <div class="sun-icon">☁️</div>
      <div>Supabase 연결 정보를 확인한 뒤 새로고침해주세요.<br/>연결이 정상화되기 전에는 데모 데이터를 표시하지 않습니다.</div>
    </div>`;
}

renderLoading();
(async()=>{
  if(!USE_SUPABASE){
